[package]
name = "ompig-sdk"
version = "0.1.0"
edition = "2024"
description = "Rust SDK for building ompig subprocess extensions"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tmih06/ompig"
homepage = "https://github.com/tmih06/ompig"
keywords = ["ompig", "extensions", "sdk", "subprocess"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value", "unbounded_depth", "float_roundtrip"] }
