# SPDX-License-Identifier: MIT

[project]
name = "ompig-sdk"
version = "0.5.3"
description = "Python SDK for building ompig subprocess extensions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Kinsy", email = "mrkinsy5@gmail.com" }]
keywords = ["ompig", "extensions", "sdk", "subprocess"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tmih06/ompig"
Repository = "https://github.com/tmih06/ompig"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ompig_sdk"
module-root = ""

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
