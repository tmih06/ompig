name: ompig-standard
description: "Explicit Ompig composition built from ordinary extension Resources."

release:
  version: 0.5.3-dev

build:
  extensionRealization: fused

extensions:
  - name: piglogin
    origins:
      - local:extensions/piglogin
  - name: pigrunner
    origins:
      - local:extensions/pigrunner
  - name: angrypigs
    origins:
      - local:extensions/angrypigs
  - name: bunruntime
    origins:
      - local:extensions/bunruntime

discovery:
  extensions: []
  skills: []

# piglogin owns /sprite and the login sprite, so the built-in ompig-login that registers the same command does not load.
strip:
  extensions: [ompig-login]
