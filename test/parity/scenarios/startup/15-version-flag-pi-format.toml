# Behavior family: startup
# Surface: executable entrypoint --version with the OMPIG_VERSION_FORMAT=pi opt-in
#
# Upstream evidence: `pi --version` prints the bare package version of the
# pinned build (see 01-version-flag). ompig prints its composite version by
# default (D63); with OMPIG_VERSION_FORMAT=pi, ompig prints the same bare version,
# so the two outputs are byte-equal and no [diverge] block applies. The
# default (composite) output stays asserted by 01-version-flag.

name = "15-version-flag-pi-format"
description = "With OMPIG_VERSION_FORMAT=pi, ompig --version prints exactly what pi --version prints (D63 opt-in)."
covers = [
  "packages/coding-agent/src/cli.ts",
]
tags = ["fast", "hermetic"]
driver = "cli-mode"

[cli]
args = ["--version"]
timeout_seconds = 15

[env]
ompig = ["OMPIG_VERSION_FORMAT=pi"]

[assert]
exit_code = 0
output_equal = true
both_match_regex = ["(?m)^{{UPSTREAM_VERSION}}$"]
both_not_contain = ["panic:", "goroutine ", "Error:"]
runs = 3
