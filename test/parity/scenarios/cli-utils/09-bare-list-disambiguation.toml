# Behavior family: cli-utils
# Surface: bare installed Package listing.
#
# Upstream Pi 0.84.0 keeps `pi list` as Package inventory. Ompig uses the same
# top-level command and output. Typed Resource and Ompiglet details remain on
# `ompig status --json` and `ompig ompiglet list`.

name = "09-bare-list-package-parity"
description = "Bare ompig list retains Pi-compatible installed Package listing"
covers = [
  "packages/coding-agent/src/package-manager-cli.ts",
]
tags = ["fast", "hermetic"]
driver = "cli-mode"

[env]
pi = ["PI_HOME=testdata/empty-home", "PI_CODING_AGENT_DIR=testdata/empty-home/agent", "PI_SKIP_VERSION_CHECK=1"]
ompig = ["OMPIG_HOME=testdata/empty-home", "OMPIG_CODING_AGENT_DIR=testdata/empty-home/agent"]
override_base_args = true

[cli]
args = ["list"]
timeout_seconds = 10

[assert]
ompig_exit_code = 0
pi_exit_code = 0
both_contain = ["No packages installed"]
output_equal = true
runs = 3
