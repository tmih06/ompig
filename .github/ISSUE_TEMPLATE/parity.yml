name: Difference from Pi
description: Ompig behaves differently from the pinned Pi release.
title: "Parity: "
labels: ["parity"]
body:
  - type: markdown
    attributes:
      value: |
        Ompig follows the Pi release shown by `ompig verify`. Report any observable difference that `docs/parity/DIVERGENCES.md` does not already number.
  - type: textarea
    id: validate
    attributes:
      label: ompig verify output
      description: Paste the output of `ompig verify`. It shows the Ompig version, the pinned Pi release, and the platform.
      render: text
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: Pi version compared against
      placeholder: "0.87.1"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, keys, or RPC messages. Include the terminal and its size for display differences.
    validations:
      required: true
  - type: textarea
    id: pi
    attributes:
      label: What Pi does
    validations:
      required: true
  - type: textarea
    id: ompig
    attributes:
      label: What Ompig does
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched docs/parity/DIVERGENCES.md and existing issues.
          required: true
        - label: The report contains no credentials, private prompts, or customer data.
          required: true
