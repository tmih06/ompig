# Reusable workflow: build a signed Ompiglet Binary on a native runner for each
# target, attest each Binary's build provenance, and publish them as one GitHub
# Release with `ompig ompiglet publish --to github`.
#
# Copy this file to .github/workflows/ompiglet-release.yml in the repository that
# holds the Ompiglet. Create the signing key once with `ompig ompiglet keygen`, store
# the private key as a repository secret, and publish the .pub file. Call the
# workflow from a workflow that runs when you push the tag v<release.version>:
#
#   on:
#     push:
#       tags: ["v*"]
#   jobs:
#     release:
#       uses: ./.github/workflows/ompiglet-release.yml
#       permissions:
#         contents: write
#         id-token: write
#         attestations: write
#       with:
#         ompiglet: agents/reviewer.yaml
#         ompig-ref: <Ompig release tag or full commit SHA>
#       secrets:
#         ompiglet-signing-key: ${{ secrets.OMPIGLET_SIGNING_KEY }}
#
# Users install the release with `ompig ompiglet pull github:<owner>/<repo>@<version>`
# and can check a Binary's provenance with `ompig verify --provenance --repo
# <owner>/<repo> --signer-workflow <owner>/<repo>/.github/workflows/ompiglet-release.yml`.
#
# Add toolchain setup steps to the build job when the Ompiglet's extensions need
# Rust or Python to build.
name: Ompiglet release

on:
  workflow_call:
    inputs:
      ompiglet:
        description: Path of the Ompiglet YAML in this repository
        required: true
        type: string
      ompig-ref:
        description: Ompig tag or full commit SHA that builds and publishes the Binaries
        required: true
        type: string
      ompig-repository:
        description: Repository that holds the Ompig source
        required: false
        type: string
        default: tmih06/ompig
      targets:
        description: JSON list of build targets, each with goos, goarch, and a native runner label
        required: false
        type: string
        default: >-
          [{"goos":"linux","goarch":"amd64","runner":"ubuntu-24.04"},
          {"goos":"linux","goarch":"arm64","runner":"ubuntu-24.04-arm"},
          {"goos":"darwin","goarch":"arm64","runner":"macos-15"},
          {"goos":"windows","goarch":"amd64","runner":"windows-2025"}]
    secrets:
      ompiglet-signing-key:
        description: Ed25519 private key PEM from `ompig ompiglet keygen`
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    steps:
      # Every target must hash the same Ompiglet source bytes.
      - name: Keep checked-out line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out Ompig
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.ompig-repository }}
          ref: ${{ inputs.ompig-ref }}
          path: .ompig-src
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .ompig-src/go.mod
          cache-dependency-path: .ompig-src/go.sum
      - name: Build Ompig
        shell: bash
        run: mkdir -p .ompig-bin && go -C .ompig-src build -trimpath -o "../.ompig-bin/ompig$(go env GOEXE)" ./cmd/ompig
      - name: Build the signed Ompiglet Binary
        shell: bash
        env:
          OMPIGLET: ${{ inputs.ompiglet }}
          OMPIGLET_SIGNING_KEY: ${{ secrets.ompiglet-signing-key }}
          OMPIG_HOME: ${{ runner.temp }}/ompig-home
          OMPIG_SOURCE_ROOT: ${{ github.workspace }}/.ompig-src
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/ompiglet-signing.key"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$OMPIGLET_SIGNING_KEY" > "$key"
          exe="$(go env GOEXE)"
          mkdir -p dist
          "./.ompig-bin/ompig$exe" ompiglet build "$OMPIGLET" --format binary --builder native \
            --targets "$TARGET_OS/$TARGET_ARCH" --sign-key "$key" \
            --out "dist/ompiglet-$TARGET_OS-$TARGET_ARCH$exe" --no-input
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Keep the Binary for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ompiglet-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out Ompig
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.ompig-repository }}
          ref: ${{ inputs.ompig-ref }}
          path: .ompig-src
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .ompig-src/go.mod
          cache-dependency-path: .ompig-src/go.sum
      - name: Build Ompig
        shell: bash
        run: mkdir -p .ompig-bin && go -C .ompig-src build -trimpath -o ../.ompig-bin/ompig ./cmd/ompig
      - name: Collect every target's Binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ompiglet-binary-*
          path: dist
          merge-multiple: true
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OMPIGLET: ${{ inputs.ompiglet }}
          OMPIGLET_SIGNING_KEY: ${{ secrets.ompiglet-signing-key }}
          OMPIG_HOME: ${{ runner.temp }}/ompig-home
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/ompiglet-signing.key"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$OMPIGLET_SIGNING_KEY" > "$key"
          ./.ompig-bin/ompig ompiglet publish "$OMPIGLET" --to github --repo "$GITHUB_REPOSITORY" \
            --sign-key "$key" --artifacts dist --commit "$GITHUB_SHA" --yes --no-input
